  droppedneedle:
    profiles: ["vpn", "no-vpn"]
    container_name: droppedneedle
    image: droppedneedle/droppedneedle:latest
    networks:
      - mynetwork
      - proxy
      - egress6 # IPv6 egress: MetaBrainz blocks our home IPv4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.droppedneedle.rule=Host(`droppedneedle.deepblue597.org`)"
      - "traefik.http.routers.droppedneedle.entrypoints=websecure"
      - "traefik.http.services.droppedneedle.loadbalancer.server.port=8688"
      - "traefik.docker.network=proxy"
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=8688
      - TZ=UTC
      - SLSKD_DOWNLOADS_PATH=/slskd-downloads
    volumes:
      - /mnt/mediaSSD/mediaStack/droppedneedle-config:/app/config
      - /mnt/mediaSSD/mediaStack/droppedneedle-cache:/app/cache
      - /mnt/mediaSSD/mediaStack/droppedneedle-plugins:/app/plugins
      - /mnt/media/mediaStack/music:/music:rw
      - /mnt/media/mediaStack/slskd/complete:/slskd-downloads:rw
      - /mnt/mediaSSD/mediaStack/droppedneedle-config-extra/gai.conf:/etc/gai.conf:ro # prefer IPv6 over IPv4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8688/health"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  # Watches the music library and automatically downloads missing .lrc lyrics from LRCLIB as new albums land.
  lrcget:
    profiles: ["vpn", "no-vpn"]
    container_name: lrcget
    image: lrcget-cli:patched
    pull_policy: never  # local-only build; backup: lrcget-config/lrcget-cli-patched.tar.gz (docker load)
    user: "1000:1000"
    networks:
      - mynetwork
    environment:
      - LRCGET_DATABASE_PATH=/data/lrcget.db
      - RUST_LOG=info
    volumes:
      - /mnt/mediaSSD/mediaStack/lrcget-config:/data
      - /mnt/media/mediaStack/music:/music
    command: ["watch", "/music", "--initial-scan", "--debounce-seconds", "30"]
    restart: unless-stopped

  slskd:
    profiles: ["vpn"]
    container_name: slskd
    image: ghcr.io/slskd/slskd:latest
    user: "1000:1000"
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASSWORD}
      - SLSKD_DOWNLOADS_DIR=/data/complete
      - SLSKD_INCOMPLETE_DIR=/data/incomplete
      - SLSKD_SHARED_DIR=/data/complete
    volumes:
      - /mnt/mediaSSD/mediaStack/slskd-config:/app
      - /mnt/media/mediaStack/slskd:/data
    restart: unless-stopped

  prowlarr:
    profiles: ["vpn", "no-vpn"]
    container_name: prowlarr
    image: linuxserver/prowlarr:2.6.5

    # Uncomment below if vpn is enabled
    depends_on: # Uncomment this line if vpn is enabled
      vpn: # Uncomment this line if vpn is enabled
        condition: service_healthy # Uncomment this line if vpn is enabled
    network_mode: service:vpn # Uncomment this line if vpn is enabled

    #networks:               # Comment this line if vpn is enabled
    #  - mynetwork           # Comment this line if vpn is enabled
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/prowlarr-config:/config

    # Comment below ports if VPN is enabled.
    #ports:
    #  - 9696:9696
    restart: unless-stopped

