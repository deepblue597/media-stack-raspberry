  jellyseerr:
    profiles: ["vpn", "no-vpn"]
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.deepblue597.org`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=proxy"

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/jellyseerr-config:/app/config
 #   ports:
 #     - 5055:5055
    restart: unless-stopped

  jellyfin:
    profiles: ["vpn", "no-vpn"]
    image: linuxserver/jellyfin:version-12.3ubu2604
    container_name: jellyfin
    networks:
      - mynetwork
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    labels:
      - "traefik.enable=true"

      # Force HTTP router
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.deepblue597.org`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"

      # Service
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

      # IMPORTANT: force correct docker network
      - "traefik.docker.network=proxy"
    volumes:
      - /mnt/mediaSSD/mediaStack/jellyfin-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/data
    # devices:
    #  - /dev/videoN:/dev/videoN # Mount GPU device
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped

  cross-seed:
    profiles: ["vpn", "no-vpn"]
    image: ghcr.io/cross-seed/cross-seed:6.13
    container_name: cross-seed
    user: 1000:1000
    networks:
      - mynetwork
    ports:
      - 2468:2468
    volumes:
      - /mnt/mediaSSD/mediaStack/cross-seed-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
      - /mnt/mediaSSD/mediaStack/qbittorrent-config/qBittorrent/BT_backup:/torrents:ro
    #      - /mnt/mediaSSD/mediaStack/cross-seed-links:/cross-seeds  # Add this line
    command: daemon
    restart: unless-stopped

