#version: "3.9"
name: media-stack
services:
  # To use/enable VPN, Run this compose file with --profile=vpn. Its highly recommended to use VPN.
  vpn:
    ## Read https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers for details on configuring VPN for your service provider.
    profiles: ["vpn"]
    container_name: vpn
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard # or wireguard
      - SERVER_COUNTRIES=Switzerland
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      #- VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn} # Valid values: nordvpn, expressvpn, protonvpn, surfshark or custom
      #- OPENVPN_USER=${OPENVPN_USER:-""}
      #- OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-""}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:5080/api/v2/app/setPreferences 2>&1'

      ## For list of server countries, visit https://raw.githubusercontent.com/qdm12/gluetun/master/internal/storage/servers.json
      ## When VPN_SERVICE_PROVIDER is custom. Comment the below line
      #- SERVER_COUNTRIES=${SERVER_COUNTRIES:-Switzerland}

      # - FREE_ONLY=on  # Valid with protonvpn only. Value willbe set "on" if using free subscription provided by protonvpn

      ## Enable below if VPN_SERVICE_PROVIDER=custom
      # - VPN_TYPE=openvpn # or wireguard.

      ## If VPN_TYPE is openvpn
      # - OPENVPN_CUSTOM_CONFIG=/gluetun/custom.conf

      ## If VPN_TYPE is wireguard. Replace below env variables as required.
      # - VPN_ENDPOINT_IP=1.2.3.4                                               # Replace with your wg endpoint ip or domain
      # - VPN_ENDPOINT_PORT=51820                                               # Replace with wg server port
      # - WIREGUARD_PUBLIC_KEY=wAUaJMhAq3NFutLHIdF8AN0B5WG8RndfQKLPTEDHal0=     # Replace with your wg public key
      # - WIREGUARD_PRIVATE_KEY=wOEI9rqqbDwnN8/Bpp22sVz48T71vJ4fYmFWujulwUU=    # Replace with your wg client private key
      # - WIREGUARD_PRESHARED_KEY=xOEI9rqqbDwnN8/Bpp22sVz48T71vJ4fYmFWujulwUU=  # Replaced with your wg pre-shared key
      # - WIREGUARD_ADDRESSES="10.64.222.21/32"                                 # Replace with wg address

    ## Enable volume if VPN_SERVICE_PROVIDER=custom and VPN_TYPE=openvpn is used
    # volumes:
    # - /yourpath/yourconfig.conf:/gluetun/config.conf:ro

    networks:
      - mynetwork
      - proxy

    labels:
      # qBittorrent reverse proxy through VPN container
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.deepblue597.org`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=5080"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.deepblue597.org`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.slskd.rule=Host(`slskd.deepblue597.org`)"
      - "traefik.http.routers.slskd.entrypoints=websecure"
      - "traefik.http.routers.slskd.service=slskd"
      - "traefik.http.services.slskd.loadbalancer.server.port=5030"
      - "traefik.docker.network=proxy"

    devices:
      - /dev/net/tun:/dev/net/tun

    # Uncomment/enable below ports if VPN is used/enabled
    ports:
      #   # qbittorrent ports
      - 5080:5080
      - 6881:6881
      - 6881:6881/udp
      # prowlarr ports
      - 9696:9696
      - 5010:5010
      # slskd ports
      - 5030:5030
      - 50300:50300
    restart: "unless-stopped"

  ## Default credentials of qBittorrent - Username: admin password: adminadmin ##
  ## Change password after install from UI --> Tools --> Options --> WebUI ##
  qbittorrent:
    profiles: ["vpn", "no-vpn"]
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:5.0.4

    # Unomment below if vpn is enabled
    depends_on: # Uncomment this line if vpn is enabled
      vpn: # Uncomment this line if vpn is enabled
        condition: service_healthy # Uncomment this line if vpn is enabled

    ## Comment below lines if VPN is enabled
    #networks:               # Comment this line if vpn is enabled
    #  - mynetwork           # Comment this line if vpn is enabled

    # Unomment below line if vpn is enabled
    network_mode: service:vpn

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=5080
      - TORRENTING_PORT=6881
    volumes:
      - /mnt/mediaSSD/mediaStack/qbittorrent-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
      - /mnt/media/Books:/books

    ## Comment/Disable below ports if VPN is enabled
    #ports:
    #  - 5080:5080
    #  - 6881:6881
    #  - 6881:6881/udp
    restart: "unless-stopped"

  mousehole:
    profiles: ["vpn"]
    container_name: mousehole
    image: tmmrtn/mousehole:latest
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - MOUSEHOLE_AUTH_PASSWORD=${MOUSEHOLE_AUTH_PASSWORD}
      - MOUSEHOLE_ALLOWED_HOSTS=${MOUSEHOLE_ALLOWED_HOSTS}
    volumes:
      - mousehole-data:/srv/mousehole
    restart: unless-stopped




  radarr:
    profiles: ["vpn", "no-vpn"]
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.1.1 #5.21.1
    networks:
      # - mynetwork   # Comment this line if VPN is enabled
      ## Uncomment below lines if VPN is enabled
      mynetwork:
        ipv4_address: ${RADARR_STATIC_CONTAINER_IP} # It should be available IPv4 address in range of docker network `mynetwork` e.g. 172.20.0.2

      proxy:

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.deepblue597.org`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=proxy"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
#    ports:
#      - 7878:7878
    volumes:
      - /mnt/mediaSSD/mediaStack/radarr-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
    restart: "unless-stopped"

  sonarr:
    profiles: ["vpn", "no-vpn"]
    image: linuxserver/sonarr:4.0.14
    container_name: sonarr
    networks:
      #  - mynetwork   # Comment this line if VPN is enabled
      ## Uncomment below lines if VPN is enabled
      mynetwork:
        ipv4_address: ${SONARR_STATIC_CONTAINER_IP} # It should be available IPv4 address in range of docker network `mynetwork` e.g. 172.20.0.2

      proxy:

    labels:
      # qBittorrent reverse proxy through VPN container
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.deepblue597.org`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=proxy"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/sonarr-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
 #   ports:
 #     - 8989:8989
    restart: unless-stopped

  lidarr:
    profiles: ["vpn", "no-vpn"]
    image: lscr.io/linuxserver/lidarr:nightly
    container_name: lidarr
    networks:
      #  - mynetwork   # Comment this line if VPN is enabled
      ## Uncomment below lines if VPN is enabled
      mynetwork:
        ipv4_address: 172.20.0.103 # It should be available IPv4 address in range of docker network `mynetwork` e.g. 172.20.0.2
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.deepblue597.org`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.docker.network=proxy"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/lidarr-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
      - /mnt/media/mediaStack/music:/music
      - /mnt/media/mediaStack/slskd:/slskd-downloads
#    ports:
#      - 8686:8686
    restart: unless-stopped

  navidrome:
    profiles: ["vpn", "no-vpn"]
    container_name: navidrome
    image: deluan/navidrome:latest
    user: "1000:1000"
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`navidrome.deepblue597.org`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
      - "traefik.docker.network=proxy"
    environment:
      - ND_LOGLEVEL=info
    volumes:
      - /mnt/mediaSSD/mediaStack/navidrome-config:/data
      - /mnt/media/mediaStack/music:/music:ro
    restart: unless-stopped

  explo:
    profiles: ["vpn", "no-vpn"]
    container_name: explo
    image: ghcr.io/lumepart/explo:latest
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.explo.rule=Host(`explo.deepblue597.org`)"
      - "traefik.http.routers.explo.entrypoints=websecure"
      - "traefik.http.services.explo.loadbalancer.server.port=7288"
      - "traefik.docker.network=proxy"
    environment:
      - TZ=UTC
      - WEB_UI=true
      - UI_USERNAME=${EXPLO_UI_USERNAME}
      - UI_PASSWORD=${EXPLO_UI_PASSWORD}
    volumes:
      - /mnt/mediaSSD/mediaStack/explo-config/.env:/opt/explo/.env
      - /mnt/mediaSSD/mediaStack/explo-config:/opt/explo/config
      - /mnt/media/mediaStack/music:/data
    restart: unless-stopped

  aurral:
    profiles: ["vpn", "no-vpn"]
    container_name: aurral
    image: ghcr.io/lklynet/aurral:latest
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aurral.rule=Host(`aurral.deepblue597.org`)"
      - "traefik.http.routers.aurral.entrypoints=websecure"
      - "traefik.http.services.aurral.loadbalancer.server.port=3001"
      - "traefik.docker.network=proxy"
    environment:
      - DOWNLOAD_FOLDER=/app/downloads
    volumes:
      - /mnt/mediaSSD/mediaStack/aurral-flows:/app/downloads
      - /mnt/mediaSSD/mediaStack/aurral-config:/app/backend/data
    restart: unless-stopped

  # Watches the music library and automatically downloads missing .lrc lyrics from LRCLIB as new albums land.
  lrcget:
    profiles: ["vpn", "no-vpn"]
    container_name: lrcget
    image: lrcget-cli:patched
    user: "1000:1000"
    networks:
      - mynetwork
    environment:
      - LRCGET_DATABASE_PATH=/data/lrcget.db
      - RUST_LOG=info
    volumes:
      - /mnt/mediaSSD/mediaStack/lrcget-config:/data
      - /mnt/media/mediaStack/music:/music
    command: ["watch", "/music", "--initial-scan", "--debounce-seconds", "30"]
    restart: unless-stopped

  slskd:
    profiles: ["vpn"]
    container_name: slskd
    image: ghcr.io/slskd/slskd:latest
    user: "1000:1000"
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASSWORD}
      - SLSKD_DOWNLOADS_DIR=/data/complete
      - SLSKD_INCOMPLETE_DIR=/data/incomplete
      - SLSKD_SHARED_DIR=/data/complete
    volumes:
      - /mnt/mediaSSD/mediaStack/slskd-config:/app
      - /mnt/media/mediaStack/slskd:/data
    restart: unless-stopped

  prowlarr:
    profiles: ["vpn", "no-vpn"]
    container_name: prowlarr
    image: linuxserver/prowlarr:2.3.5 #1.32.2

    # Uncomment below if vpn is enabled
    depends_on: # Uncomment this line if vpn is enabled
      vpn: # Uncomment this line if vpn is enabled
        condition: service_healthy # Uncomment this line if vpn is enabled
    network_mode: service:vpn # Uncomment this line if vpn is enabled

    #networks:               # Comment this line if vpn is enabled
    #  - mynetwork           # Comment this line if vpn is enabled
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/prowlarr-config:/config

    # Comment below ports if VPN is enabled.
    #ports:
    #  - 9696:9696
    restart: unless-stopped

  recommendarr:
    profiles: ["recommendarr"]
    container_name: recommendarr
    image: tannermiddleton/recommendarr:v1.3.0
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.recommendarr.rule=Host(`recommendarr.deepblue597.org`)"
      - "traefik.http.routers.recommendarr.entrypoints=websecure"
      - "traefik.http.services.recommendarr.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3000
      - PUBLIC_URL=https://recommendarr.deepblue597.org # Change this public URL if you are accessing recommendarr on a domain
    volumes:
      - /mnt/mediaSSD/mediaStack/recommendarr-data:/app/server/data
#    ports:
#      - 3000:3000
    restart: unless-stopped

  jellyseerr:
    profiles: ["vpn", "no-vpn"]
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    init: true
    networks:
      - mynetwork
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.deepblue597.org`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=proxy"

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - /mnt/mediaSSD/mediaStack/jellyseerr-config:/app/config
 #   ports:
 #     - 5055:5055
    restart: unless-stopped

  jellyfin:
    profiles: ["vpn", "no-vpn"]
    image: linuxserver/jellyfin:10.11.4
    container_name: jellyfin
    networks:
      - mynetwork
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    labels:
      - "traefik.enable=true"

      # Force HTTP router
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.deepblue597.org`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"

      # Service
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

      # IMPORTANT: force correct docker network
      - "traefik.docker.network=proxy"
    volumes:
      - /mnt/mediaSSD/mediaStack/jellyfin-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/data
    # devices:
    #  - /dev/videoN:/dev/videoN # Mount GPU device
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 8920:8920
    restart: unless-stopped

  cross-seed:
    profiles: ["vpn", "no-vpn"]
    image: ghcr.io/cross-seed/cross-seed:6.13
    container_name: cross-seed
    user: 1000:1000
    networks:
      - mynetwork
    ports:
      - 2468:2468
    volumes:
      - /mnt/mediaSSD/mediaStack/cross-seed-config:/config
      - /mnt/media/mediaStack/torrent-downloads:/downloads
      - /mnt/mediaSSD/mediaStack/qbittorrent-config/qBittorrent/BT_backup:/torrents:ro
    #      - /mnt/mediaSSD/mediaStack/cross-seed-links:/cross-seeds  # Add this line
    command: daemon
    restart: unless-stopped

  # Doc: https://github.com/navilg/cleanmyarr
  # cleanmyarr:
  #   profiles: ["vpn", "no-vpn"]
  #   depends_on:
  #     - radarr
  #     - sonarr
  #   image: linuxshots/cleanmyarr:0.8.1
  #   container_name: cleanmyarr
  #   networks:
  #     - mynetwork
  #   volumes:
  #     - cleanmyarr-config:/config
  # restart: unless-stopped
  # environment:
  # - CMA_MAINTENANCE_CYCLE=${CMA_MAINTENANCE_CYCLE:-""}
  # - CMA_DELETE_AFTER_DAYS=${CMA_DELETE_AFTER_DAYS:-""}
  # - CMA_ENABLE_EMAIL_NOTIFICATION=${CMA_ENABLE_EMAIL_NOTIFICATION:-""}
  # - CMA_SMTP_USERNAME=${CMA_SMTP_USERNAME:-""}
  # - CMA_SMTP_ENCODED_PASSWORD=${CMA_SMTP_ENCODED_PASSWORD:-""}
  # - CMA_SMTP_TO_EMAILS=${CMA_SMTP_TO_EMAILS:-""}
  # - CMA_ENABLE_GOTIFY_NOTIFICATION=${CMA_ENABLE_GOTIFY_NOTIFICATION:-""}
  # - CMA_GOTIFY_URL=${CMA_GOTIFY_URL:-""}
  # - CMA_GOTIFY_ENCODED_APP_TOKEN=${CMA_GOTIFY_ENCODED_APP_TOKEN:-""}
  # - CMA_ENABLE_TELEGRAM_NOTIFICATION=${CMA_ENABLE_TELEGRAM_NOTIFICATION:-""}
  # - CMA_TELEGRAM_ENCODED_BOT_TOKEN=${CMA_TELEGRAM_ENCODED_BOT_TOKEN:-""}
  # - CMA_TELEGRAM_CHAT_ID=${CMA_TELEGRAM_CHAT_ID:-""}
  # - CMA_MONITOR_RADARR=${CMA_MONITOR_RADARR:-""}
  # - CMA_RADARR_URL=${CMA_RADARR_URL:-""}
  # - CMA_RADARR_ENCODED_API_KEY=${CMA_RADARR_ENCODED_API_KEY:-""}
  # - CMA_RADARR_ENABLE_NOTIFICATION=${CMA_RADARR_ENABLE_NOTIFICATION:-""}

volumes:
  torrent-downloads:
  radarr-config:
  sonarr-config:
  prowlarr-config:
  jellyfin-config:
  qbittorrent-config:
  jellyseerr-config:
  recommendarr-data:
  cross-seed-config:
  mousehole-data:
  # cleanmyarr-config:

networks:
  mynetwork:
    external: true
  proxy:
    external: true
#RADARR_STATIC_CONTAINER_IP=172.20.0.101 SONARR_STATIC_CONTAINER_IP=172.20.0.102 docker compose --profile vpn up -d
